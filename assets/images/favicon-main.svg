<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- The tapered "!" shape (wide at top, slim at bottom) -->
    <g id="bang-shape">
      <!-- 
        Top width: 128px (x: 192 to 320)
        Bottom width: 68px (x: 222 to 290)
      -->
      <path d="M 192 80 A 32 32 0 0 1 224 48 L 288 48 A 32 32 0 0 1 320 80 L 290 280 A 34 34 0 0 1 222 280 Z" />
      <circle cx="256" cy="396" r="46" />
    </g>

    <!-- Ben-Day halftone dot screen — classic comic book angle at 28deg -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <circle cx="9" cy="9" r="3.8" fill="#1A1A2E"/>
    </pattern>

    <!-- Mask: defines the "!" shape for the halftone overlay -->
    <mask id="bang-mask">
      <use href="#bang-shape" fill="white" />
    </mask>

    <!-- Edge roughness: makes the whole mark feel choppy/hand-inked -->
    <filter id="choppy" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#choppy)" transform="rotate(-9, 256, 270)">

    <!-- LAYER 1: Dark navy shadow offset (+11, +9) — misregistered second-color plate -->
    <use href="#bang-shape" fill="#1A1A2E" transform="translate(11, 9)" />

    <!-- LAYER 2: Cyan chromatic fringe offset (-9, -3) — left-bleed color split -->
    <use href="#bang-shape" fill="#00CFFF" opacity="0.55" transform="translate(-9, -3)" />

    <!-- LAYER 3: Main orange shape -->
    <use href="#bang-shape" fill="#FF5722" />

    <!-- LAYER 4: Ben-Day halftone dot overlay, punched through the ! mask -->
    <rect x="-50" y="-50" width="612" height="612" fill="url(#dots)" mask="url(#bang-mask)" opacity="0.48"/>

  </g>
</svg>
