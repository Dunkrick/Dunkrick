<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - Rithwick</title>
  
  <!-- Resource Hints (CDN Optimizations) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }
    
    .admin-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 24px;
      text-align: center;
    }
    
    .admin-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 48px;
      width: 100%;
      max-width: 400px;
    }
    
    .admin-input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text);
      outline: none;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }
    
    .admin-input:focus {
      border-color: var(--accent);
    }
    
    #dashboard-view {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      text-align: left;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Custom Cursor -->
  <div id="cursor"></div>

  <!-- Navbar -->
  <nav id="nav">
    <a href="index.html" class="heading-sans" style="font-size: clamp(1rem, 2vw, 1.25rem); letter-spacing: 0.12em; color: var(--text); text-decoration: none;">
      RITHWICK
    </a>
    <ul class="nav-links">
      <li><a href="index.html" style="color: var(--accent);">← Back to Site</a></li>
    </ul>
  </nav>

  <main class="admin-container">
    
    <!-- LOGIN VIEW -->
    <div id="login-view" class="admin-box">
      <h1 class="hero-headline" style="font-size: 32px; margin-bottom: 8px;">Admin Portal</h1>
      <p style="color: var(--muted); margin-bottom: 32px;">Restricted access.</p>
      
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email Address" required class="admin-input" />
        <input type="password" id="login-password" placeholder="Password" required class="admin-input" />
        
        <button type="submit" id="login-btn" class="btn-primary" style="width: 100%; padding: 16px; font-size: 15px; border: none; cursor: pointer;">
          Login
        </button>
        <p id="login-status" style="display: none; font-size: 14px; margin-top: 16px; color: #EF4444;"></p>
      </form>
    </div>

    <!-- DASHBOARD VIEW (Hidden by default) -->
    <div id="dashboard-view" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 24px; margin-bottom: 40px;">
        <h1 class="hero-headline" style="font-size: 40px; margin: 0;">CMS Dashboard</h1>
        <button id="logout-btn" class="btn-ghost" style="padding: 8px 16px;">Logout</button>
      </div>
      
      <div class="admin-box" style="max-width: 100%; text-align: left; padding: 32px;">
        <h2 style="font-family: var(--font-display); font-size: 24px; margin-bottom: 24px;">Add New Project</h2>
        
        <form id="project-form" style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Project Title</label>
            <input type="text" id="proj-title" placeholder="e.g. Supabase CMS" required class="admin-input" style="margin-bottom: 0;" />
          </div>
          
          <div>
            <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Role / Tagline</label>
            <input type="text" id="proj-role" placeholder="e.g. Product Design · Development" required class="admin-input" style="margin-bottom: 0;" />
          </div>
          
          <div>
            <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Description</label>
            <textarea id="proj-desc" placeholder="Brief summary of the project..." required class="admin-input" rows="4" style="margin-bottom: 0; resize: vertical;"></textarea>
          </div>
          
          <div>
            <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Image URL</label>
            <input type="url" id="proj-image" placeholder="https://..." required class="admin-input" style="margin-bottom: 0;" />
          </div>
          
          <div>
            <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Project URL</label>
            <input type="url" id="proj-url" placeholder="https://..." required class="admin-input" style="margin-bottom: 0;" />
          </div>
          
          <button type="submit" id="proj-submit" class="btn-primary" style="padding: 16px; margin-top: 16px; font-size: 15px; border: none; cursor: pointer;">
            Publish Project ↗
          </button>
          
          <p id="proj-status" style="display: none; font-size: 14px; margin-top: 8px; text-align: center;"></p>
        </form>
      </div>
    </div>

  </main>

  <!-- Load GSAP for the custom cursor (Deferred) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script defer src="script.js"></script>
  
  <!-- Load our custom admin logic as a module -->
  <script defer type="module" src="admin.js"></script>

</body>
</html>
